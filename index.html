<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Practice</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Typing Practice</h1>
        
        <!-- Passage Selector -->
        <div class="selector-container">
            <label>Select Passage:</label>
            <select id="passageSelector">
                <!-- Options populated by JavaScript -->
            </select>
        </div>

        <!-- Reference Text Display -->
        <div class="box">
            <h2>Reference Text:</h2>
            <div id="referenceText">
                <!-- Reference text populated here -->
            </div>
        </div>

        <!-- Timer and Stats -->
        <div class="stats-container">
            <div class="stat">
                <p class="stat-label">Time</p>
                <p id="timer" class="stat-value timer-value">0.0s</p>
            </div>
            <div class="stat">
                <p class="stat-label">Words Per Minute</p>
                <p id="wpm" class="stat-value wpm-value">0</p>
            </div>
        </div>

        <!-- User Input Area -->
        <div class="box">
            <h2>Type Here:</h2>
            <textarea 
                id="userInput" 
                tabindex="1"
                placeholder="Start typing the passage above..."
            ></textarea>
        </div>
        <div class="navigation-buttons">
            <button id="prevButton" tabindex="4">← Previous Passage</button>
            <button id="resetButton" tabindex="3">↻ Reset</button>
            <button id="nextButton" tabindex="2">Next Passage →</button>
        </div>
    </div>

    <footer class="footer">
        <p>A project by Eamonn</p>
        <div class="social-links">
            <a href="https://youtube.com/@EamonnCottrell" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                <i class="fab fa-youtube"></i>
            </a>
            <a href="https://linkedin.com/in/eamonncottrell" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="https://github.com/sieis" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
